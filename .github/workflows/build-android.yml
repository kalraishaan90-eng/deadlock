name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Transpile Web App Bundle
        run: |
          npx --yes esbuild app.jsx --outfile=app.js

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html config.js app.js manifest.json icon.svg sw.js android/app/src/main/assets/www/
          cp -r vendor android/app/src/main/assets/www/

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Configure Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Build Android APK
        working-directory: android
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/DeadLock-release-unsigned.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/DeadLock-release.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/DeadLock-debug.apk
          else
            echo "Locating built APK files..."
            find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/ \;
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadLock-Android-APK
          path: build-output/*.apk
