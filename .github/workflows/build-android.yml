name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Transpile Web App Bundle
        run: |
          npx esbuild app.jsx --outfile=app.js

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html config.js app.js manifest.json icon.svg sw.js android/app/src/main/assets/www/
          cp -r vendor android/app/src/main/assets/www/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Clarity
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/DeadLock-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadLock-Android-APK
          path: build-output/DeadLock-debug.apk
